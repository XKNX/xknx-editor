<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XKNX Editor</title>
<style>
  /* The app's font and (once connected) its theme colours: the page's own few elements look like
     the app's. */
  @font-face { font-family: "XKNX"; src: url("font.ttf") format("truetype"); }
  :root {
    --bg: #f0f0f0; --panel: #ffffff; --text: #1e1e1e; --muted: #6e6e6e; --frame: #ffffff;
    --border: #c8c8c8; --button: #e1e1e1; --button-hovered: #d0e4f7; --font-px: 15px;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body, button { font: var(--font-px) "XKNX", system-ui, sans-serif; color: var(--text); }
  #ui { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  /* Receives the keyboard: typed text, dead keys, IME and paste arrive here. */
  #keys { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
          resize: none; font-size: 16px; pointer-events: none; }
  .box { background: var(--panel); border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0, 0, 0, .25); }
  button { background: var(--button); border: 1px solid var(--border); padding: 3px 14px; min-width: 90px; }
  button:hover { background: var(--button-hovered); }
  #status { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); padding: 10px 16px; }
  #status:empty { display: none; }
  #banner { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex;
            gap: 12px; align-items: center; padding: 5px 6px 5px 12px; }
  #chooser { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 30; display: flex;
             gap: 6px; align-items: center; padding: 10px; }
  #chooser .close { min-width: 0; padding: 3px 9px; }
  [hidden] { display: none !important; }
  body.dragging::after { content: ""; position: fixed; inset: 6px; border: 2px dashed var(--muted);
                         pointer-events: none; }
</style>
</head>
<body>
<canvas id="ui"></canvas>
<textarea id="keys" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<div id="banner" class="box" hidden><span></span><button></button></div>
<div id="chooser" class="box" hidden><button class="choose"></button><button class="close">×</button></div>
<div id="status" class="box">…</div>
<script src="client.js"></script>
</body>
</html>
