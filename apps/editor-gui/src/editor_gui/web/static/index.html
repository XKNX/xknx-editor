<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XKNX Editor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f3f3f3; --panel: #ffffff; --text: #1e1e1e; --muted: #666; --line: #d0d0d0;
    --accent: #2f6fb2; --accent-text: #fff; --row: #eef3fa; --shade: rgba(0, 0, 0, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1e1e1e; --panel: #2b2b2b; --text: #e6e6e6; --muted: #a0a0a0; --line: #444;
            --accent: #4a8fd8; --accent-text: #fff; --row: #33404f; --shade: rgba(0, 0, 0, .55); }
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
  #ui { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  /* Receives the keyboard: typed text, dead keys, IME and paste arrive here. */
  #keys { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0;
          resize: none; font-size: 16px; pointer-events: none; }
  #status { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); color: #ddd;
            font: 15px system-ui, sans-serif; background: #2b2b2b; padding: 12px 18px; border-radius: 6px; }
  #status:empty { display: none; }
  .ui-font, .shade, .toast, #banner { font: 14px system-ui, sans-serif; color: var(--text); }
  #banner { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex;
            gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line);
            border-radius: 6px; padding: 6px 8px 6px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.3); }
  #banner[hidden] { display: none; }
  .shade { position: fixed; inset: 0; background: var(--shade); display: grid; place-items: center; z-index: 30; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px;
           width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px); display: flex;
           flex-direction: column; gap: 10px; box-shadow: 0 6px 30px rgba(0,0,0,.4); }
  .modal.dragging { outline: 2px dashed var(--accent); outline-offset: -6px; }
  .modal h3 { margin: 0 0 2px; font-size: 16px; }
  .modal h4 { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-weight: 600; }
  .modal .path, .modal .note { margin: 0; color: var(--muted); word-break: break-all; }
  .list { border: 1px solid var(--line); border-radius: 4px; overflow: auto; min-height: 60px; max-height: 300px; }
  .row { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; padding: 5px 8px; cursor: default;
         align-items: center; }
  .row:hover { background: var(--row); }
  .row.selected { background: var(--accent); color: var(--accent-text); }
  .row .size, .row .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .row.selected .size, .row.selected .when { color: inherit; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 10px; color: var(--muted); }
  .drop { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); }
  .field { display: grid; grid-template-columns: 120px 1fr; gap: 10px; align-items: center; }
  .check { display: flex; gap: 8px; align-items: center; }
  .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  button, .button, select, input[type=text] { font: inherit; color: var(--text); background: var(--bg);
           border: 1px solid var(--line); border-radius: 4px; padding: 5px 12px; text-decoration: none; }
  button:disabled { opacity: .5; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  #toasts { position: fixed; right: 12px; bottom: 36px; display: flex; flex-direction: column; gap: 8px; z-index: 25; }
  .toast { display: flex; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line);
           border-radius: 6px; padding: 8px 8px 8px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.3); max-width: 420px; }
  .toast span { overflow-wrap: anywhere; }
  .toast .x { border: 0; background: none; padding: 0 6px; font-size: 16px; }
</style>
</head>
<body>
<canvas id="ui"></canvas>
<textarea id="keys" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<div id="banner" hidden><span></span><button></button></div>
<div id="layer"></div>
<div id="toasts"></div>
<div id="status">…</div>
<script src="client.js"></script>
</body>
</html>
