[project]
name = "xknxeditor-gui"
dynamic = ["version"]
description = "XKNX Editor - KNX project editor"
license = "GPL-2.0-only"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "fastmcp>=4.1.0",
    "httpx>=0.28",
    "imgui-bundle>=1.92.0",
    "platformdirs>=4.0",
    "pypdf>=4.0",
    "sqlalchemy>=2.0.49",
    "structlog>=24.0.0",
    "uvicorn>=0.47",
    "xknx>=4.0",
    "xknxeditor-catalog",
    "xknxeditor-download",
    "xknxeditor-datasecure",
    "xknxeditor-namespaces",
    "xknxeditor-prod",
    "xknxeditor-proj",
    "xknxeditor-recover",
]

[project.scripts]
generate-demo = "editor_gui.scripts.generate_demo:main"
generate-catalog = "editor_gui.scripts.generate_catalog:main"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: editor_gui.__version__ (bump it there for each release; the
# packaging metadata, the About screen and the update check all read from it).
[tool.hatch.version]
path = "src/editor_gui/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/editor_gui"]

[tool.uv.sources]
xknxeditor-catalog = { workspace = true }
xknxeditor-download = { workspace = true }
xknxeditor-datasecure = { workspace = true }
xknxeditor-namespaces = { workspace = true }
xknxeditor-prod = { workspace = true }
xknxeditor-proj = { workspace = true }
xknxeditor-recover = { workspace = true }
