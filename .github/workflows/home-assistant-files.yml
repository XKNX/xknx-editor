name: Home Assistant release files

# The files the Home Assistant integration (XKNX/xknx-editor-ha-integration) installs the editor
# from: the locked requirements file, the wheels it names and the key-extraction helpers
# (apps/editor-gui/packaging/home_assistant/release_files.py).
# - release published (xknx-editor-v*): build and attach them to that GitHub Release.
# - workflow_dispatch: build them for a tag and keep them as a workflow artifact only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the files for (xknx-editor-v<version>)
        required: true

permissions:
  contents: write # needed to upload assets to the release

jobs:
  files:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'xknx-editor-v')
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.0.1
      # The helpers are built like in the Docker image, with the .NET SDK.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build the files
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
          DOTNET_NOLOGO: "1"
        run: python3 apps/editor-gui/packaging/home_assistant/release_files.py --tag "$TAG" --out ha-release
      - uses: actions/upload-artifact@v7
        with:
          name: home-assistant-release-files
          path: |
            ha-release/*.txt
            ha-release/*.zip
            ha-release/*.whl
          if-no-files-found: error
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" ha-release/*.txt ha-release/*.zip ha-release/*.whl --clobber
