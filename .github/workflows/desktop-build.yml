name: Desktop build

# Package the XKNX Editor into a standalone desktop app on each OS (see apps/editor-gui/DEPLOY.md).
# Windows gets an installer per architecture (XKNX-Editor-windows-installer-x64/arm64.exe, built with
# Inno Setup, see apps/editor-gui/packaging/windows) next to the portable ZIPs.
# - workflow_dispatch / tag push: build and keep the archives as workflow artifacts.
# - release published (created by release-please for the xknx-editor component): build and attach
#   the per-OS archives to that GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write # needed to upload assets to the release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Library releases (xknxeditor-namespaces, ...) also fire 'release'; only build for the app's release.
    if: >-
      github.event_name != 'release' ||
      (startsWith(github.event.release.tag_name, 'v') ||
       startsWith(github.event.release.tag_name, 'xknx-editor-v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: XKNX-Editor-macos.zip
          - os: windows-latest
            asset: XKNX-Editor-windows-portable-x64.zip
          # (The x64 installer, which offers software OpenGL, and the native ARM64 Windows build are
          # separate jobs below; Windows-on-ARM is almost always a VM without a usable OpenGL driver.)
          # Build on the OLDEST available LTS, not ubuntu-latest: a PyInstaller bundle only runs on
          # a glibc >= the one it was built against, so building on an older glibc widens the set of
          # user systems it runs on. (ubuntu-latest also auto-migrates to newer images over time,
          # which would silently raise the glibc floor.)
          - os: ubuntu-22.04
            asset: XKNX-Editor-linux.tar.gz
    steps:
      - uses: actions/checkout@v7
      # Build against a python.org CPython, NOT uv's managed python-build-standalone: the latter's
      # python3xx.dll does not load under a PyInstaller bundle on Windows ("Failed to load Python
      # DLL … FormatMessageW failed"). UV_PYTHON pins every uv command to this interpreter.
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.13"
      - run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
        shell: bash
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - name: Package with PyInstaller
        working-directory: apps/editor-gui
        run: >-
          uv run --package xknxeditor-gui --with pyinstaller --with typer
          pyinstaller --noconfirm --clean xknx-editor.spec

      # actions/setup-python bundles its OWN OpenSSL (from actions/python-versions), whose
      # libcrypto-3.dll deterministically fails to load on some Windows machines (the OS loader
      # access-violates in ntdll, surfacing as GetLastError 998/193) even though it is a valid x64 PE.
      # python.org's OFFICIAL CPython ships the same OpenSSL version but a build that loads fine.
      # Overlay python.org's official libcrypto/libssl (from the matching embeddable) INTO the packaged
      # bundle after PyInstaller. Overwriting the interpreter's DLLs dir beforehand proved unreliable
      # (PyInstaller still collected setup-python's copy). Same OpenSSL 3.x version, ABI-compatible with
      # _ssl.pyd.
      - name: Overlay python.org's official OpenSSL into the bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/editor-gui
        run: |
          $ErrorActionPreference = "Stop"
          $pyver = (uv run --package xknxeditor-gui python -c "import platform;print(platform.python_version())").Trim()
          $mach = (uv run --package xknxeditor-gui python -c "import platform;print(platform.machine())").Trim()
          $abi = if ($mach -eq "ARM64") { "arm64" } else { "amd64" }
          $embed = "python-$pyver-embed-$abi.zip"
          Write-Host "Fetching official python.org OpenSSL from $embed"
          curl.exe -fL -o $embed "https://www.python.org/ftp/python/$pyver/$embed"
          New-Item -ItemType Directory -Force -Path embed_openssl | Out-Null
          Expand-Archive -Force $embed -DestinationPath embed_openssl
          $internal = "dist\XKNX-Editor\_internal"
          foreach ($n in "libcrypto-3.dll","libssl-3.dll") {
            $dst = Join-Path $internal $n
            # The overlay fixes actions/setup-python's x64 OpenSSL. On arm64 PyInstaller may bundle
            # OpenSSL differently (or not at that path), so skip rather than fail when it is absent.
            if (-not (Test-Path $dst)) { Write-Host "skip $n (not present in bundle, e.g. arm64)"; continue }
            Copy-Item "embed_openssl\$n" $dst -Force
            Write-Host "Overlaid $n from python.org $pyver ($abi) into the bundle"
          }

      # A Linux ELF binary cannot embed an icon, so ship a user-local installer that registers a
      # .desktop launcher + themed icon (the only way the desktop environment shows one). The icon
      # itself is already bundled in the app assets (install.sh reads it from there), so we do not
      # drop a loose PNG next to the binary.
      - name: Add Linux installer to the bundle
        if: runner.os == 'Linux'
        working-directory: apps/editor-gui
        run: |
          cp tools/install.sh tools/uninstall.sh dist/XKNX-Editor/
          chmod +x dist/XKNX-Editor/install.sh dist/XKNX-Editor/uninstall.sh

      # Also package the Linux build as a single-file AppImage (run-anywhere, no install step),
      # alongside the tar.gz. Built from the same PyInstaller onedir output. appimagetool is itself
      # an AppImage; run it with APPIMAGE_EXTRACT_AND_RUN so it needs no FUSE on the runner.
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/editor-gui
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ARCH: x86_64
        run: |
          set -eu
          rm -rf AppDir
          mkdir -p AppDir/usr/bin
          # The onedir payload (binary + _internal). Installer scripts make no sense inside an
          # AppImage, so drop them.
          cp -a dist/XKNX-Editor/. AppDir/usr/bin/
          rm -f AppDir/usr/bin/install.sh AppDir/usr/bin/uninstall.sh
          # Top-level icon (required by appimagetool) plus a themed copy; the name matches the
          # desktop file's Icon= key.
          icon=AppDir/usr/bin/_internal/editor_gui/assets/app_settings/icon.png
          install -D "$icon" AppDir/usr/share/icons/hicolor/512x512/apps/xknx-editor.png
          cp "$icon" AppDir/xknx-editor.png
          # AppStream metainfo: lets software centres list the app and clears appimagetool's
          # "AppStream metadata is missing" warning. appimagetool expects the file named after the
          # desktop file (xknx-editor.desktop -> xknx-editor.appdata.xml).
          install -D packaging/xknx-editor.appdata.xml \
            AppDir/usr/share/metainfo/xknx-editor.appdata.xml
          cat > AppDir/xknx-editor.desktop <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=XKNX Editor
          Comment=KNX project editor
          Exec=XKNX-Editor
          Icon=xknx-editor
          Terminal=false
          Categories=Utility;Development;
          StartupWMClass=XKNX-Editor
          DESKTOP
          cat > AppDir/AppRun <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/XKNX-Editor" "$@"
          APPRUN
          chmod +x AppDir/AppRun
          curl -fL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ./appimagetool AppDir XKNX-Editor-x86_64.AppImage

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: XKNX-Editor-x86_64.AppImage
          path: apps/editor-gui/XKNX-Editor-x86_64.AppImage
          if-no-files-found: error

      - name: Attach AppImage to release (Linux)
        if: runner.os == 'Linux' && github.event_name == 'release'
        shell: bash
        working-directory: apps/editor-gui
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "XKNX-Editor-x86_64.AppImage" --clobber

      # Bundle the build output into a single archive (the macOS .app, or the onedir folder).
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        working-directory: apps/editor-gui/dist
        run: ditto -c -k --keepParent "XKNX-Editor.app" "../${{ matrix.asset }}"
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: apps/editor-gui/dist
        run: Compress-Archive -Path "XKNX-Editor" -DestinationPath "..\${{ matrix.asset }}"
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        working-directory: apps/editor-gui/dist
        run: tar czf "../${{ matrix.asset }}" "XKNX-Editor"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: apps/editor-gui/${{ matrix.asset }}
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        working-directory: apps/editor-gui
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber

  # Windows "compat" build: the pip imgui-bundle wheel is OpenGL-only, and a GPU-less VM (UTM/QEMU on a
  # Mac, Windows-on-ARM x64 emulation) has no usable OpenGL driver, so the app cannot create a window.
  # This variant ships Mesa's software OpenGL (opengl32.dll) next to the exe and selects the llvmpipe
  # gallium driver (LLVM JIT -> native code, multithreaded, far faster than softpipe). softpipe (pure
  # C, no JIT) stays reachable via GALLIUM_DRIVER=softpipe as a manual fallback. No source rebuild:
  # the normal OpenGL-only wheel is reused; only the GL driver DLL is swapped.
  # The x64 installer is built here too: its "Software rendering" option installs these Mesa DLLs.
  build-windows-softwaregl:
    name: Build (windows x64 installer, software OpenGL)
    runs-on: windows-latest
    if: >-
      github.event_name != 'release' ||
      (startsWith(github.event.release.tag_name, 'v') ||
       startsWith(github.event.release.tag_name, 'xknx-editor-v'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.13"
      - run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
        shell: bash
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-packages

      - name: Package with PyInstaller
        working-directory: apps/editor-gui
        run: >-
          uv run --package xknxeditor-gui --with pyinstaller --with typer
          pyinstaller --noconfirm --clean xknx-editor.spec

      - name: Overlay python.org's official OpenSSL into the bundle
        shell: pwsh
        working-directory: apps/editor-gui
        run: |
          $ErrorActionPreference = "Stop"
          $pyver = (uv run --package xknxeditor-gui python -c "import platform;print(platform.python_version())").Trim()
          $embed = "python-$pyver-embed-amd64.zip"
          curl.exe -fL -o $embed "https://www.python.org/ftp/python/$pyver/$embed"
          New-Item -ItemType Directory -Force -Path embed_openssl | Out-Null
          Expand-Archive -Force $embed -DestinationPath embed_openssl
          $internal = "dist\XKNX-Editor\_internal"
          foreach ($n in "libcrypto-3.dll","libssl-3.dll") {
            Copy-Item "embed_openssl\$n" (Join-Path $internal $n) -Force
          }

      # Fetch prebuilt Mesa for Windows (pal1000/mesa-dist-win) and keep its x64 opengl32.dll + sibling
      # DLLs in mesa\. The installer and the portable bundle put them NEXT TO THE EXE: Windows' safe
      # DLL search resolves opengl32 from the app dir before system32, so GLFW loads Mesa instead of
      # the (missing/1.1) system driver. desktop_entry sets GALLIUM_DRIVER=llvmpipe at startup (see
      # tools/desktop_entry.py).
      - name: Bundle Mesa software OpenGL (softpipe)
        shell: pwsh
        working-directory: apps/editor-gui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Invoke-RestMethod "https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "xknx-editor-ci" }
          $asset = $rel.assets | Where-Object { $_.name -match "release-msvc\.7z$" } | Select-Object -First 1
          if (-not $asset) { throw "no release-msvc.7z asset in mesa-dist-win latest release" }
          Write-Host "Mesa: $($asset.name)"
          curl.exe -fL -o mesa.7z $asset.browser_download_url
          7z x mesa.7z -omesa_extract | Out-Null
          $og = Get-ChildItem mesa_extract -Recurse -Filter opengl32.dll | Where-Object { $_.FullName -match "\\x64\\" } | Select-Object -First 1
          if (-not $og) { $og = Get-ChildItem mesa_extract -Recurse -Filter opengl32.dll | Select-Object -First 1 }
          if (-not $og) { throw "opengl32.dll not found in Mesa archive" }
          Write-Host "Mesa x64 dir: $($og.DirectoryName)"
          # WGL software OpenGL needs only the ICD loader (opengl32.dll) + the gallium driver
          # (libgallium_wgl.dll, which contains softpipe/llvmpipe). Skip Mesa's D3D12/Vulkan/OpenCL/
          # video-encoder DLLs (clon12compiler alone is ~120 MB) — they bloat the archive by ~440 MB.
          New-Item -ItemType Directory -Force -Path mesa | Out-Null
          foreach ($n in "opengl32.dll","libgallium_wgl.dll") {
            $src = Join-Path $og.DirectoryName $n
            if (-not (Test-Path $src)) { throw "expected Mesa DLL $n" }
            Copy-Item $src "mesa\" -Force
          }
          Get-ChildItem "mesa" | Format-List Name,Length

      - name: Build installer (x64)
        shell: pwsh
        working-directory: apps/editor-gui
        run: >-
          ./packaging/windows/build_installer.ps1 -Arch x64
          -SourceDir dist\XKNX-Editor -MesaDir mesa -OutputDir .

      - name: Assemble portable software OpenGL bundle
        shell: pwsh
        working-directory: apps/editor-gui
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item "mesa\*.dll","packaging\windows\software_gl.marker" "dist\XKNX-Editor\" -Force
          Push-Location dist
          Compress-Archive -Path "XKNX-Editor" -DestinationPath "..\XKNX-Editor-windows-portable-x64-softwaregl.zip" -Force
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: XKNX-Editor-windows-installer-x64.exe
          path: apps/editor-gui/XKNX-Editor-windows-installer-x64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: XKNX-Editor-windows-portable-x64-softwaregl.zip
          path: apps/editor-gui/XKNX-Editor-windows-portable-x64-softwaregl.zip
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        working-directory: apps/editor-gui
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}" --clobber
          "XKNX-Editor-windows-installer-x64.exe" "XKNX-Editor-windows-portable-x64-softwaregl.zip"


  # Native ARM64 software-OpenGL compat build for Windows-on-ARM VMs (UTM/QEMU) with no OpenGL driver.
  # Ships mmozeiko/build-mesa's NATIVE arm64 Mesa (llvmpipe) next to the exe. Native arm64 llvmpipe JITs
  # arm64 code and runs fine (x64 llvmpipe crashed only because it was emulated). desktop_entry selects
  # GALLIUM_DRIVER=llvmpipe on arm64.
  build-windows-arm64:
    name: Build (windows arm64)
    runs-on: windows-11-arm
    if: >-
      github.event_name != 'release' ||
      (startsWith(github.event.release.tag_name, 'v') ||
       startsWith(github.event.release.tag_name, 'xknx-editor-v'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: "3.13"
      - run: echo "UV_PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"
        shell: bash
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-packages

      - name: Package with PyInstaller
        working-directory: apps/editor-gui
        run: >-
          uv run --package xknxeditor-gui --with pyinstaller --with typer
          pyinstaller --noconfirm --clean xknx-editor.spec

      - name: Bundle native ARM64 Mesa software OpenGL (llvmpipe)
        shell: pwsh
        working-directory: apps/editor-gui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Invoke-RestMethod "https://api.github.com/repos/mmozeiko/build-mesa/releases/latest" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "xknx-editor-ci" }
          $asset = $rel.assets | Where-Object { $_.name -match "mesa-llvmpipe-arm64-.*\.7z$" } | Select-Object -First 1
          if (-not $asset) { throw "no mesa-llvmpipe-arm64 asset in mmozeiko/build-mesa latest release" }
          Write-Host "Mesa: $($asset.name)"
          curl.exe -fL -o mesa.7z $asset.browser_download_url
          7z x mesa.7z -omesa_extract | Out-Null
          $og = Get-ChildItem mesa_extract -Recurse -Filter opengl32.dll | Select-Object -First 1
          if (-not $og) { throw "opengl32.dll not found in Mesa arm64 archive" }
          Write-Host "Mesa arm64 dir: $($og.DirectoryName)"
          # mmozeiko's Mesa is statically linked, so opengl32.dll is self-contained (no separate
          # libgallium_wgl.dll like pal1000's x64 build). Keep opengl32.dll (required) plus
          # libgallium_wgl.dll only if this build happens to ship it. Skip Mesa's GLES/EGL/Vulkan DLLs.
          New-Item -ItemType Directory -Force -Path mesa | Out-Null
          Copy-Item (Join-Path $og.DirectoryName "opengl32.dll") "mesa\" -Force
          $gal = Join-Path $og.DirectoryName "libgallium_wgl.dll"
          if (Test-Path $gal) { Copy-Item $gal "mesa\" -Force }
          Get-ChildItem "mesa" | Format-List Name,Length

      # The installer offers the Mesa DLLs as "Software rendering", selected by default on arm64.
      - name: Build installer (arm64)
        shell: pwsh
        working-directory: apps/editor-gui
        run: >-
          ./packaging/windows/build_installer.ps1 -Arch arm64
          -SourceDir dist\XKNX-Editor -MesaDir mesa -OutputDir .

      - name: Assemble portable bundle (with software OpenGL)
        shell: pwsh
        working-directory: apps/editor-gui
        run: |
          $ErrorActionPreference = "Stop"
          Copy-Item "mesa\*.dll","packaging\windows\software_gl.marker" "dist\XKNX-Editor\" -Force
          Push-Location dist
          Compress-Archive -Path "XKNX-Editor" -DestinationPath "..\XKNX-Editor-windows-portable-arm64.zip" -Force
          Pop-Location

      - uses: actions/upload-artifact@v7
        with:
          name: XKNX-Editor-windows-installer-arm64.exe
          path: apps/editor-gui/XKNX-Editor-windows-installer-arm64.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: XKNX-Editor-windows-portable-arm64.zip
          path: apps/editor-gui/XKNX-Editor-windows-portable-arm64.zip
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        shell: bash
        working-directory: apps/editor-gui
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}" --clobber
          "XKNX-Editor-windows-installer-arm64.exe" "XKNX-Editor-windows-portable-arm64.zip"

  # WinGet: write the manifests of this release's installers (packaging/winget/make_manifests.py) and
  # keep them as an artifact. With the repository secret WINGET_TOKEN (a classic token with
  # public_repo of an account that has a fork of microsoft/winget-pkgs) they are also submitted there
  # as a pull request. The first submission of the package is reviewed by hand by the WinGet team.
  winget:
    name: WinGet manifests
    runs-on: windows-latest
    needs: [build-windows-softwaregl, build-windows-arm64]
    if: >-
      github.event_name == 'release' &&
      (startsWith(github.event.release.tag_name, 'v') ||
       startsWith(github.event.release.tag_name, 'xknx-editor-v'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: XKNX-Editor-windows-installer-*.exe
          merge-multiple: true
          path: installers
      - name: Write manifests
        shell: pwsh
        run: >-
          python apps/editor-gui/packaging/winget/make_manifests.py
          --tag "${{ github.event.release.tag_name }}"
          --x64 installers/XKNX-Editor-windows-installer-x64.exe
          --arm64 installers/XKNX-Editor-windows-installer-arm64.exe
          --out winget-manifests
      - uses: actions/upload-artifact@v7
        with:
          name: winget-manifests
          path: winget-manifests
          if-no-files-found: error
      - name: Submit to microsoft/winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:WINGET_TOKEN) { Write-Host "WINGET_TOKEN is not set: the manifests are kept as an artifact only"; exit 0 }
          curl.exe -fsSL -o wingetcreate.exe https://aka.ms/wingetcreate/latest
          $dir = (Get-ChildItem winget-manifests -Recurse -Filter *.installer.yaml | Select-Object -First 1).DirectoryName
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN $dir

  # Home Assistant: start the integration's "Editor Release" workflow, which releases the integration
  # for this editor version. Its own schedule only looks every few hours. Needs the repository secret
  # HA_INTEGRATION_TOKEN (a fine-grained token for XKNX/xknx-editor-ha-integration with Actions:
  # Read and write); without it the schedule picks the release up later.
  home-assistant:
    name: Home Assistant integration
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'release' &&
      (startsWith(github.event.release.tag_name, 'v') ||
       startsWith(github.event.release.tag_name, 'xknx-editor-v'))
    steps:
      - name: Start the integration's release
        env:
          GH_TOKEN: ${{ secrets.HA_INTEGRATION_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "HA_INTEGRATION_TOKEN is not set: the integration's schedule picks the release up"
            exit 0
          fi
          gh workflow run editor-release.yml -R XKNX/xknx-editor-ha-integration
