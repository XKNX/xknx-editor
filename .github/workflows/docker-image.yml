name: Container images

# Builds the browser-UI container in two flavours and pushes them to GHCR:
#   - xknx-editor-web                 multi-arch (amd64 + arm64), for plain docker run / Compose
#   - xknx-editor-ha-{amd64,aarch64}  one tag per arch, referenced by the Home Assistant add-on
#
# Pushes on a version tag (xknx-editor-v*). A manual run builds without pushing unless "push" is
# ticked, so the Dockerfile can be validated without publishing.

on:
  push:
    tags:
      - "xknx-editor-v*"
  workflow_dispatch:
    inputs:
      push:
        description: Push the built images to GHCR
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version, owner and push decision
        id: meta
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__\s*=\s*\"([^\"]+)\"',pathlib.Path('apps/editor-gui/src/editor_gui/__init__.py').read_text()).group(1))")
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.push }}" = "true" ]; then
            push=true
          else
            push=false
          fi
          {
            echo "version=$version"
            echo "owner=$owner"
            echo "push=$push"
          } >>"$GITHUB_OUTPUT"
          echo "Building $version for $owner (push=$push)"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push }}
          # No provenance attestation: it is published as an extra "unknown/unknown" platform entry
          # in the image index, which the package page lists next to the real architectures.
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/xknx-editor-web:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/xknx-editor-web:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build Home Assistant image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: ha
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push }}
          # No provenance attestation: it is published as an extra "unknown/unknown" platform entry
          # in the image index, which the package page lists next to the real architectures.
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/xknx-editor-ha:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/xknx-editor-ha:${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=ha
          cache-to: type=gha,mode=max,scope=ha
