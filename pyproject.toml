[project]
name = "xknxeditor-monorepo"
version = "0.1.0"
description = "XKNX Editor monorepo"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "xknxeditor-namespaces",
    "xknxeditor-prod",
    "xknxeditor-proj",
    "xknxeditor-datasecure",
    "xknxeditor-catalog",
    "xknxeditor-download",
    "xknxeditor-dali",
    "xknxeditor-recover",
    # The GUI app is a workspace member too; depend on it so a plain `uv sync` installs the whole
    # thing (incl. imgui-bundle) — testpaths runs its tests, so `uv sync` must provide its deps.
    "xknxeditor-gui",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.4",
    "pyright>=1.1",
    "structlog>=24.0.0",  # injected logger type for xknxeditor-namespaces converter; no runtime dep there
    "xmlschema>=3.0",  # validate exported .knxproj XML against the bundled KNX project XSD
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
asyncio_mode = "auto"
# A SQLAlchemy warning is a bug in our database handling (e.g. deleting rows that are gone).
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.coverage.run]
# Measured in CI with `pytest --cov` and uploaded to Codecov: the packages and the app,
# without the generated XML bindings (files/, intermediate/) and the tests.
source = [
    "packages/catalog/src",
    "packages/dali/src",
    "packages/datasecure/src",
    "packages/download/src",
    "packages/namespaces/src",
    "packages/prod/src",
    "packages/proj/src",
    "packages/recover/src",
    "apps/editor-gui/src",
]
omit = [
    "*/files/*",
    "*/intermediate/*",
    "*/tests/*",
    # tray icon backends of Windows and macOS: CI runs on Linux, whose backend is measured
    "*/web/tray/windows.py",
    "*/web/tray/macos.py",
]
relative_files = true
# sys.monitoring (Python 3.12+): same result as the default tracer, in about 60 % of the time
core = "sysmon"

[tool.coverage.report]
# Lines that never run by design
exclude_also = [
    "if TYPE_CHECKING:",
    '@(typing\.)?overload',
    "raise NotImplementedError",
    'if __name__ == "__main__":',
]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
xknxeditor-namespaces = { workspace = true }
xknxeditor-prod = { workspace = true }
xknxeditor-proj = { workspace = true }
xknxeditor-datasecure = { workspace = true }
xknxeditor-gui = { workspace = true }
xknxeditor-catalog = { workspace = true }
xknxeditor-download = { workspace = true }
xknxeditor-dali = { workspace = true }
xknxeditor-recover = { workspace = true }
# Keep-link-less-com-objects (PR #634) is merged on upstream main but not yet in a
# PyPI release; pin to the merge commit until a release >= 3.11 ships, then drop this.
xknxproject = { git = "https://github.com/XKNX/xknxproject", rev = "f97db068884eca2b460abb1fb4db2262345f7f47" }
