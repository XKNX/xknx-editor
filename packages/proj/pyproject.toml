[project]
name = "xknxeditor-proj"
version = "0.1.0"
description = "XKNX project library"
license = "GPL-2.0-only"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=42.0; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "cryptography==46.0.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "sqlalchemy>=2.0.0",
    "xknxeditor-namespaces",
    "xknxproject>=3.10",
    "pyzipper>=0.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxeditor"]
# Ship the C# helpers (read by core.key_extract to compile at runtime).
artifacts = [
    "src/xknxeditor/proj/core/_extract.cs",
    "src/xknxeditor/proj/core/_extract_trace.cs",
    "src/xknxeditor/proj/core/_extract_oauth.cs",
    "src/xknxeditor/proj/core/_ets_export.cs",
    "src/xknxeditor/proj/core/_ets5_export.cs",
]
