[project]
name = "xknxeditor-download"
version = "0.1.0"
description = "XKNX device download library"
license = "GPL-2.0-only"
requires-python = ">=3.13"
dependencies = [
    "xknxeditor-namespaces",
    "xknxeditor-prod",
    # Pinned: relies on P2PConnection.request(payload, expected) and the
    # management API as published in the 3.x line.
    "xknx>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xknxeditor"]
