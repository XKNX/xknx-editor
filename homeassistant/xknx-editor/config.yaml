---
# Home Assistant add-on manifest. The Supervisor pulls the prebuilt multi-architecture image
# (built and pushed by .github/workflows/docker-image.yml) rather than building from a Dockerfile.
# Keep `version` in step with the app version in apps/editor-gui/src/editor_gui/__init__.py: it is
# also the image tag the Supervisor pulls.
name: XKNX Editor
version: "0.6.3"
slug: xknx_editor
description: Browser-based KNX project editor, with ETS signing-key extraction
url: https://github.com/XKNX/xknx-editor/tree/main/homeassistant/xknx-editor
image: ghcr.io/xknx/xknx-editor-ha
arch:
  - amd64
  - aarch64
# The image carries its own init (tini as PID 1), so Docker's init process is not needed.
init: false
# Served through Home Assistant Ingress: HA signs the user in and reverse-proxies to port 8080.
ingress: true
ingress_port: 8080
# Stream large POST bodies to the editor instead of buffering them in the Supervisor: it receives
# project and product-file uploads (.knxproj / .knxprod) that can be several megabytes.
ingress_stream: true
panel_icon: mdi:chip
panel_title: XKNX Editor
boot: manual
startup: application
# Mount the shared folder so an ETS installation directory dropped there (for signing-key
# extraction) and project files are reachable from the editor's file dialogs.
map:
  - type: share
    read_only: false
